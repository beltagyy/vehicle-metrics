name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - '*.md'
  workflow_dispatch:

jobs:
  check-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Verify documentation
        run: |
          echo "✓ Documentation files verified"
          find . -name "*.md" -type f | head -10
