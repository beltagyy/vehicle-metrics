name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v3

      - name: Lint markdown files
        run: |
          echo "Checking markdown documentation..."
          for file in *.md; do
            if [ -f "$file" ]; then
              echo "✓ Found: $file"
            fi
          done
