name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black pylint mypy isort bandit

      - name: Run Black formatter
        run: black backend/ --line-length=100

      - name: Run isort
        run: isort backend/ --profile black

      - name: Run Pylint
        run: pylint backend/ --fail-under=8.0 || true

      - name: Run MyPy type checker
        run: mypy backend/ --ignore-missing-imports || true

      - name: Run Bandit security check
        run: bandit -r backend/ -f json -o bandit-report.json || true

      - name: Install Node dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint frontend/ --max-warnings 0 || true

      - name: Run Prettier
        run: npx prettier --write frontend/

      - name: Commit formatting changes
        run: |
          git config --global user.name "Mohamed ElBeltagy"
          git config --global user.email "mohamedbeltagyy@gmail.com"
          git add -A
          git diff --cached --exit-code || git commit -m "style: auto-format code with Black, isort, and Prettier"

      - name: Push changes
        if: github.event_name == 'push'
        run: git push
