name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v3

      - name: Check if backend exists
        id: backend-check
        run: |
          if [ -d "backend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if frontend exists
        id: frontend-check
        run: |
          if [ -d "frontend" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.backend-check.outputs.exists == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        if: steps.frontend-check.outputs.exists == 'true'
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install Python dependencies
        if: steps.backend-check.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install black pylint mypy isort bandit

      - name: Run Black formatter
        if: steps.backend-check.outputs.exists == 'true'
        run: black backend/ --line-length=100 || true

      - name: Run isort
        if: steps.backend-check.outputs.exists == 'true'
        run: isort backend/ --profile black || true

      - name: Run Pylint
        if: steps.backend-check.outputs.exists == 'true'
        run: pylint backend/ --fail-under=8.0 || true

      - name: Run MyPy type checker
        if: steps.backend-check.outputs.exists == 'true'
        run: mypy backend/ --ignore-missing-imports || true

      - name: Run Bandit security check
        if: steps.backend-check.outputs.exists == 'true'
        run: bandit -r backend/ -f json -o bandit-report.json || true

      - name: Install Node dependencies
        if: steps.frontend-check.outputs.exists == 'true'
        run: npm ci

      - name: Run ESLint
        if: steps.frontend-check.outputs.exists == 'true'
        run: npx eslint frontend/ --max-warnings 0 || true

      - name: Run Prettier
        if: steps.frontend-check.outputs.exists == 'true'
        run: npx prettier --write frontend/ || true

      - name: Commit formatting changes
        if: steps.backend-check.outputs.exists == 'true' || steps.frontend-check.outputs.exists == 'true'
        run: |
          git config --global user.name "Mohamed ElBeltagy"
          git config --global user.email "mohamedbeltagyy@gmail.com"
          git add -A
          git diff --cached --exit-code || git commit -m "style: auto-format code with Black, isort, and Prettier" || true

      - name: Push changes
        if: (steps.backend-check.outputs.exists == 'true' || steps.frontend-check.outputs.exists == 'true') && github.event_name == 'push'
        run: git push || true

      - name: No code to check
        if: steps.backend-check.outputs.exists == 'false' && steps.frontend-check.outputs.exists == 'false'
        run: echo "ℹ️  Backend and frontend will be created in Phase 1 implementation"
